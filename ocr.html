<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BhuChain OCR</title>
<style>
  :root {
    --bg:#F2F4F6; --card:#fff; --ink:#111C24; --mute:#5E6B75; --line:#d2d2d7;
    --gold:#B88A2E; --gold-soft:#F6EEDC; --gold-ink:#7E5D17; --red:#b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0b1219; --card:#121c26; --ink:#e8edf1; --mute:#9aa7b2; --line:#2a3846;
      --gold:#d3a54a; --gold-soft:#2b2414; --gold-ink:#e6c27a; --red:#f08a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--mute); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  #drop { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    min-height: 160px; border: 2px dashed var(--line); border-radius: 10px; text-align:center;
    color: var(--mute); cursor: pointer; padding: 16px; }
  #drop.over { border-color: var(--gold); background: var(--gold-soft); }
  #preview { max-width: 100%; max-height: 360px; display: none; border-radius: 6px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top: 12px; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--gold); border-color: var(--gold); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  label { color: var(--mute); font-size: 14px; }
  progress { width: 100%; height: 8px; }
  #status { color: var(--mute); font-size: 14px; min-height: 21px; }
  #status.err { color: var(--red); }
  textarea { width: 100%; min-height: 220px; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; }
  .stats { color: var(--gold-ink); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>OCR — English text</h1>
  <p class="sub">Pick, drop or paste an image. Only English text (A–Z letters, digits and common punctuation) is kept; other scripts such as Odia or Hindi are dropped.</p>

  <section class="card">
    <div id="drop" tabindex="0">
      <img id="preview" alt="Selected image">
      <span id="dropText">Tap to choose an image, drop one here, or paste with Ctrl+V</span>
    </div>
    <input id="file" type="file" accept="image/*" hidden>
    <div class="row">
      <button id="run" class="primary" disabled>Extract text</button>
      <label>Min. confidence
        <select id="conf">
          <option value="0">Any</option>
          <option value="40">40%</option>
          <option value="60" selected>60%</option>
          <option value="80">80%</option>
        </select>
      </label>
    </div>
    <div class="row"><progress id="bar" max="1" value="0" hidden></progress></div>
    <div id="status"></div>
  </section>

  <section class="card">
    <textarea id="out" placeholder="Extracted English text appears here" readonly></textarea>
    <div class="row">
      <button id="copy" disabled>Copy</button>
      <button id="save" disabled>Download .txt</button>
      <span id="stats" class="stats"></span>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const drop = $('drop'), file = $('file'), preview = $('preview'), run = $('run');
  const bar = $('bar'), status = $('status'), out = $('out'), stats = $('stats');
  let image = null;

  // A word counts as English when, after folding typographic quotes and dashes,
  // it holds only printable ASCII and at least one letter or digit.
  const FOLD = { '‘':"'", '’':"'", '“':'"', '”':'"', '–':'-', '—':'-', '…':'...', ' ':' ' };
  const fold = s => s.replace(/[‘’“”–—… ]/g, c => FOLD[c]);
  const isEnglish = w => /^[\x21-\x7E]+$/.test(w) && /[A-Za-z0-9]/.test(w);

  function englishOnly(data, minConf) {
    let kept = 0, dropped = 0;
    const lines = [];
    for (const line of data.lines || []) {
      const words = [];
      let bad = 0;
      for (const word of line.words || []) {
        const text = fold(word.text.trim());
        if (text && isEnglish(text) && word.confidence >= minConf) words.push(text);
        else if (text) bad++;
      }
      // A line that is mostly another script is dropped whole, so stray
      // Latin-looking misreads of Odia or Hindi letters do not leak through.
      if (words.length > bad) { lines.push(words.join(' ')); kept += words.length; dropped += bad; }
      else dropped += words.length + bad;
      // Keep paragraph breaks from the source.
      if (line === line.paragraph?.lines?.at(-1) && lines.length && lines.at(-1) !== '') lines.push('');
    }
    return { text: lines.join('\n').trim(), kept, dropped };
  }

  function setImage(blob) {
    if (!blob || !blob.type.startsWith('image/')) { say('That file is not an image.', true); return; }
    image = blob;
    preview.src = URL.createObjectURL(blob);
    preview.style.display = 'block';
    $('dropText').textContent = 'Tap to choose a different image';
    run.disabled = false;
    say('');
  }
  function say(msg, err) { status.textContent = msg; status.classList.toggle('err', !!err); }

  drop.addEventListener('click', () => file.click());
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } });
  file.addEventListener('change', () => setImage(file.files[0]));
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); setImage(e.dataTransfer.files[0]); });
  document.addEventListener('paste', e => {
    const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
    if (item) setImage(item.getAsFile());
  });

  let worker = null;
  async function getWorker() {
    if (!worker) {
      worker = await Tesseract.createWorker('eng', 1, {
        logger: m => {
          if (m.status === 'recognizing text') { bar.value = m.progress; say('Reading text… ' + Math.round(m.progress * 100) + '%'); }
          else if (m.status) say(m.status.charAt(0).toUpperCase() + m.status.slice(1) + '…');
        },
      });
    }
    return worker;
  }

  run.addEventListener('click', async () => {
    if (!image) return;
    run.disabled = true; bar.hidden = false; bar.value = 0;
    try {
      const w = await getWorker();
      const { data } = await w.recognize(image);
      const res = englishOnly(data, Number($('conf').value));
      out.value = res.text;
      stats.textContent = res.kept + ' English words kept, ' + res.dropped + ' dropped';
      $('copy').disabled = $('save').disabled = !res.text;
      say(res.text ? 'Done.' : 'No English text found in this image.');
    } catch (err) {
      say('Could not read the image: ' + (err.message || err), true);
    } finally {
      run.disabled = false; bar.hidden = true;
    }
  });

  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(out.value); say('Copied.'); }
    catch { out.select(); say('Press Ctrl+C to copy.'); }
  });
  $('save').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([out.value], { type: 'text/plain' }));
    a.download = 'ocr-english.txt';
    a.click();
    URL.revokeObjectURL(a.href);
  });

})();
</script>
</body>
</html>
