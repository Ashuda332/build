name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Furniture library — licences, hashes, sizes, pivots
        run: node tools/validate-catalog.mjs
      - name: Placement rules over generated houses
        run: node tests/run-placement.mjs --quick
      - name: Furniture UI — styles, library, save and reopen
        run: node tests/ui-flow.mjs
      - name: Bungalow exterior styles on different houses
        run: node tests/exterior.mjs
